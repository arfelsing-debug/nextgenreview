name: NextGen interpretive report validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test NextGen server
        working-directory: server
        run: npm ci
      - name: Install browser build
        run: npm ci
      - name: Build online report
        run: npm run build
